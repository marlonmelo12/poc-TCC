services:
  jupyter:
    build:
      context: .
      dockerfile: Dockerfile
    image: tcc-qubo-mrmr:latest
    container_name: tcc-jupyter
    ports:
      - "8888:8888"
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      - OMP_NUM_THREADS=4
      - MKL_NUM_THREADS=4
      - NVIDIA_VISIBLE_DEVICES=all
    shm_size: '4gb'
    stdin_open: true
    tty: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root --NotebookApp.token='' --NotebookApp.password=''

  experiment:
    build:
      context: .
      dockerfile: Dockerfile
    image: tcc-qubo-mrmr:latest
    container_name: tcc-experiment
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      - OMP_NUM_THREADS=4
      - MKL_NUM_THREADS=4
      - NVIDIA_VISIBLE_DEVICES=all
    shm_size: '4gb'
    stdin_open: true
    tty: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: bash
